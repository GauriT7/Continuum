name: Continuum build and voice-agent verification

on:
  push:
    branches:
      - main
      - feature/voice-agent-sarvam-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run instant voice-agent unit tests
        run: npm test
      - name: Check API and server route syntax
        run: |
          find api src/server -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build production bundle
        run: npm run build
